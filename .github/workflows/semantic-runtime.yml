name: optional semantic runtime

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-runtime:
    runs-on: ubuntu-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: '0.11.1'
      - name: Verify all maintained pins resolve together
        run: >-
          uv pip compile --python-version 3.12 --python-platform aarch64-apple-darwin
          evals/requirements-semantic.txt --constraint evals/requirements-semantic.in
          --output-file "$RUNNER_TEMP/semantic-resolved.txt"
