name: ragguard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify selected interpreter
        run: uv run --frozen python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python-version }}'"

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy ragguard

      - name: Tests
        run: uv run --frozen pytest --cov=ragguard --cov-report=term-missing

      - name: Smoke-test attack demonstrations
        run: uv run --frozen python examples/document_poisoning_demos.py

      - name: Smoke-test harness boundary integration
        run: uv run --frozen python examples/harness_boundary.py

      - name: Build distributable
        run: uv build

      - name: Verify installed wheel outside source tree
        run: |
          uv venv "$RUNNER_TEMP/ragguard-wheel" --python "${{ matrix.python-version }}"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/ragguard-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/ragguard-wheel/bin/python" -r "$RUNNER_TEMP/ragguard-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/ragguard-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ragguard-wheel/bin/python" -I -c "from ragguard import ContentBoundary, Document; assert ContentBoundary().require(Document('Useful facts.')) == 'Useful facts.'"

  deepseek-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/deepseek/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix integrations/deepseek ci
      - run: npm --prefix integrations/deepseek run typecheck
      - name: Test real harness registry and Python worker
        run: RAGGUARD_TEST_PYTHON="$PWD/.venv/bin/python" npm --prefix integrations/deepseek test
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: integrations/deepseek
      - name: Verify packed JavaScript with installed Python wheel
        run: |
          uv build
          uv venv "$RUNNER_TEMP/ragguard-plugin-wheel" --python "3.12"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/ragguard-plugin-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/ragguard-plugin-wheel/bin/python" -r "$RUNNER_TEMP/ragguard-plugin-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/ragguard-plugin-wheel/bin/python" --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/ragguard-npm"
          tar -xzf "$RUNNER_TEMP"/dsh-ragguard-*.tgz -C "$RUNNER_TEMP/ragguard-npm"
          cd "$RUNNER_TEMP"
          RAGGUARD_TEST_PYTHON="$RUNNER_TEMP/ragguard-plugin-wheel/bin/python" node "$GITHUB_WORKSPACE/integrations/deepseek/tests/package-smoke.mjs" "$RUNNER_TEMP/ragguard-npm/package"
