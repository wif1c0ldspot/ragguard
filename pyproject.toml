[project]
name = "ragguard"
version = "0.2.0"
description = "Security scanner for Retrieval-Augmented Generation pipelines — detects prompt injection, metadata poisoning, chunk-splitting exploits, and vector store contamination"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "wif1c0ldspot"}
]
keywords = ["rag", "llm-security", "prompt-injection", "owasp-llm-top-10", "vector-store"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The base install is standard-library only: detection is heuristic and
# explainable (regex families). numpy only powers the vector-store checker and
# ships in the ``vector`` extra.
# Framework integrations (LangChain, LlamaIndex, ChromaDB) are on the roadmap;
# when they land they belong in optional extras, not the base install.
dependencies = []

[project.optional-dependencies]
vector = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "numpy>=1.26",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/wif1c0ldspot/ragguard"
Documentation = "https://github.com/wif1c0ldspot/ragguard/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/wif1c0ldspot/ragguard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragguard"]

[tool.hatch.build.targets.sdist]
exclude = ["integrations/deepseek/node_modules", "integrations/deepseek/dist", ".venv-dsh"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
# numpy 2.x stubs use PEP 695 `type` statements, which mypy only parses when it
# is told to target 3.12+. The package still supports 3.10 at runtime; this only
# affects how the stubs are parsed.
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
